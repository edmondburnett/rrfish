[workspace]
resolver = "3"
members = ["rrfind", "rrfish-core", "rrfish-mcp", "rrfish-types", "rrfishd"]

[workspace.package]
edition = "2024"
repository = "https://github.com/edmondburnett/rrfish"
license = "MIT"

[workspace.dependencies]
color-eyre = "0.6.5"
reqwest = { version = "0.13.5", features = ["json"] }
rrfish-core = { path = "rrfish-core" }
rrfish-types = { path = "rrfish-types" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
